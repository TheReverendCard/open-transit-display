name: Check AT and Metlink GTFS feeds
on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/fetch_standard_feeds.py'
      - 'tests/test_standard_feeds.py'
      - '.github/workflows/import_standard_feeds.yml'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        provider: [auckland, metlink]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install realtime decoder
        run: python -m pip install 'gtfs-realtime-bindings>=1.0.0'
      - name: Test feed authentication
        run: python -m unittest discover -s tests -p 'test_*feeds.py'
      - name: Fetch and validate official feeds
        env:
          AUCKLAND_TRANSPORT_PRIMARY: ${{ secrets.AUCKLAND_TRANSPORT_PRIMARY }}
          AUCKLAND_TRANSPORT_SECONDARY: ${{ secrets.AUCKLAND_TRANSPORT_SECONDARY }}
          METLINK: ${{ secrets.METLINK }}
        run: python collector/fetch_standard_feeds.py --provider '${{ matrix.provider }}'
      - name: Import representative timetable routes
        run: |
          routes=''
          if [ '${{ matrix.provider }}' = 'auckland' ]; then routes='18,70,NX1'; fi
          python gtfs/import_gtfs.py --source 'data/${{ matrix.provider }}/gtfs.zip' --route-short-names "$routes" --days 7 --start-date "$(TZ=Pacific/Auckland date +%F)" --agency-label '${{ matrix.provider }}' --output-dir 'data/${{ matrix.provider }}/display'
      - name: Upload snapshots and connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.provider }}-feeds-${{ github.run_id }}'
          path: 'data/${{ matrix.provider }}/**'
          retention-days: 30
          if-no-files-found: error

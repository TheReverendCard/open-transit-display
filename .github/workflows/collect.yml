name: Collect realtime transit data

on:
  workflow_dispatch:
  push:
    paths:
      - "collector/collect_rideguide.py"
      - "collector/check_rideguide_health.py"
      - "requirements.txt"
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Ride Guide GTFS-Realtime
        env:
          RUN_SECONDS: "600"
          OUTPUT_DIR: data/run
        run: python collector/collect_rideguide.py

      - name: Check Whangārei realtime feed health
        run: >-
          python collector/check_rideguide_health.py
          --input data/run
          --timezone Pacific/Auckland
          --min-trip-updates 1
          --min-routes 1
          --warn-min-vehicles 1
          --warn-min-routes 5
          --max-feed-age-seconds 300
          --weekday-start 05:45
          --weekday-end 19:15
          --saturday-start 06:40
          --saturday-end 17:30
          --summary-json data/run/health_summary.json

      - name: Upload collected observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-${{ github.run_id }}
          path: |
            data/run/*.jsonl.gz
            data/run/health_summary.json
          retention-days: 90
          if-no-files-found: error

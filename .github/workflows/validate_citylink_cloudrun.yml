name: Validate private CityLink Cloud Run collector

on:
  pull_request:
    paths:
      - 'cloudrun/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/validate_citylink_cloudrun.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r cloudrun/requirements.txt
      - name: Syntax check and offline unit tests
        run: |
          python -m py_compile cloudrun/citylink_monitor.py collector/citylink_gtfsrt_bridge.py collector/publish_citylink_gtfsrt_snapshot.py collector/service_windows.py
          PYTHONPATH=collector python -m unittest discover -s cloudrun -p 'test_*.py' -v
      - name: Verify container builds
        run: docker build -t citylink-metadata-monitor:ci -f Dockerfile .
      - name: Check isolated HTTP health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name citylink-metadata-test -p 127.0.0.1:18080:8080 citylink-metadata-monitor:ci
          trap 'docker rm -f citylink-metadata-test >/dev/null 2>&1 || true' EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ready"'; then
              echo 'Health endpoint responds correctly'
              exit 0
            fi
            sleep 1
          done
          docker logs citylink-metadata-test
          exit 1

name: Import Christchurch GTFS and check live feed

on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/fetch_metro.py'
      - 'tests/test_metro.py'
      - '.github/workflows/import_metro.yml'

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install realtime decoder
        run: python -m pip install 'gtfs-realtime-bindings>=1.0.0'
      - name: Test subscription fallback
        run: python -m unittest discover -s tests -p test_metro.py
      - name: Fetch both official feeds using repository secrets
        env:
          METRO_LIVE_FEED_PRIMARY: ${{ secrets.METRO_LIVE_FEED_PRIMARY }}
          METRO_LIVE_FEED_SECONDARY: ${{ secrets.METRO_LIVE_FEED_SECONDARY }}
        run: python collector/fetch_metro.py
      - name: Import the complete Christchurch timetable
        run: >-
          python gtfs/import_gtfs.py
          --source data/metro/gtfs.zip
          --days 7
          --start-date "$(TZ=Pacific/Auckland date +%F)"
          --agency-label "Christchurch public transport"
          --output-dir data/metro/display
      - name: Upload feed snapshots and connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-feeds-${{ github.run_id }}
          path: data/metro/**
          retention-days: 30
          if-no-files-found: error

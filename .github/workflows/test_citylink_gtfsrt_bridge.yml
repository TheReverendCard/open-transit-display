name: Validate derived CityLink GTFS-Realtime bridge
on:
  pull_request:
    paths:
      - 'collector/citylink_gtfsrt_bridge.py'
      - 'collector/publish_citylink_gtfsrt_snapshot.py'
      - 'tests/test_citylink_gtfsrt_bridge.py'
      - 'tests/test_citylink_gtfsrt_snapshot.py'
      - '.github/workflows/test_citylink_gtfsrt_bridge.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gtfs-realtime-bindings websockets
      - run: python -m unittest discover -s tests -p 'test_citylink_gtfsrt*.py' -v
      - run: python -m py_compile collector/citylink_gtfsrt_bridge.py collector/publish_citylink_gtfsrt_snapshot.py

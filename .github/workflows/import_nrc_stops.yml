name: Import NRC CityLink bus stops

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/import_nrc_stops.py"
      - ".github/workflows/import_nrc_stops.yml"
      - "requirements.txt"
  schedule:
    - cron: "20 15 * * 1"

permissions:
  contents: read

jobs:
  import-stops:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NRC CityLink stop layer
        run: >-
          python analysis/import_nrc_stops.py
          --output-dir data/nrc_stops

      - name: Show summary
        run: cat data/nrc_stops/nrc_citylink_stops_summary.json

      - name: Upload NRC stop data
        uses: actions/upload-artifact@v4
        with:
          name: nrc-citylink-stops-${{ github.run_id }}
          path: data/nrc_stops/*
          retention-days: 90
          if-no-files-found: error

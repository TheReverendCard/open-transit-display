name: Check display notice and firmware foundations
on:
  workflow_dispatch:
  pull_request:
    paths: ['device_service/**', 'firmware/**', 'tests/device_service/**', 'collector/collect_rideguide.py', '.github/workflows/device-foundation.yml']
  push:
    branches: [main, 'prepare/**']
    paths: ['device_service/**', 'firmware/**', 'tests/device_service/**', 'collector/collect_rideguide.py', '.github/workflows/device-foundation.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r device_service/requirements.txt gtfs-realtime-bindings websockets
      - run: python -m unittest discover -s tests/device_service -v
      - run: g++ -std=c++17 -Wall -Wextra -Werror firmware/shared/policy_test.cpp -o /tmp/policy-test && /tmp/policy-test
      - run: python -m compileall -q device_service firmware/raspberry_pi collector/collect_rideguide.py
  esp32-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        board: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: pio run -d firmware/esp32 -e ${{ matrix.board }}
      # Deliberately no release binaries: these are unprovisioned scaffolds.

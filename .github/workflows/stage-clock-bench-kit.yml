name: Stage verified clock bench download
on:
  push:
    branches: [experiment/ee04-differential-clock]
    paths: [.github/workflows/stage-clock-bench-kit.yml]
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19885d6770ac23499af2c6b71c62ef1ca6a5421d
          persist-credentials: false
      - name: Read the pinned build and prepare its downloadable kit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh run watch 45080622668 --exit-status --interval 10
          gh run download 45080622668 -n OTD_Clock_Refresh_Bench -D "$RUNNER_TEMP/clock-input"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('firmware/experiments/ee04-clock-bench/')
          files = ['README.md','Install_Bench.cmd','Restore_Sign.cmd','Build_Bench.cmd','bench_flash.py','ClockRefreshBench/ClockRefreshBench.ino','ClockRefreshBench/OTDRadioCompat.h','test_recovery.py']
          artifact = pathlib.Path(os.environ['RUNNER_TEMP'])/'clock-input'
          b, = artifact.rglob('ClockRefreshBench.bin')
          digest = hashlib.sha256(b.read_bytes()).hexdigest()
          expected, = artifact.rglob('ClockRefreshBench.sha256')
          assert digest == expected.read_text().split()[0]
          assert b.read_bytes()[0] == 0xe9 and b.stat().st_size < 0x200000
          z = pathlib.Path(os.environ['RUNNER_TEMP'])/'OTD_Clock_Refresh_Bench.zip'
          with zipfile.ZipFile(z, 'w', zipfile.ZIP_DEFLATED) as out:
              for n in files:
                  data = (root/n).read_bytes()
                  if n.endswith('.cmd'): data = data.replace(b'\r\n',b'\n').replace(b'\n',b'\r\n')
                  out.writestr(n,data)
              out.write(b,'ClockRefreshBench.bin')
              out.writestr('ClockRefreshBench.sha256',digest+'  ClockRefreshBench.bin\n')
          with zipfile.ZipFile(z) as kit:
              assert kit.testzip() is None
              assert hashlib.sha256(kit.read('ClockRefreshBench.bin')).hexdigest() == digest
          data = z.read_bytes()
          payload = json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()})
          blob = subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['REPO']+'/git/blobs','--input','-','--jq','.sha'],input=payload,text=True).strip()
          print('CLOCK_BENCH_KIT', blob, hashlib.sha256(data).hexdigest(), len(data), digest, b.stat().st_size)
          PY

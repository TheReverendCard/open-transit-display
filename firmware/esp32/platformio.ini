; Development scaffold only. No radio, panel driver or trusted keys enabled.
[platformio]
default_envs = xiao_s3_wio_epaper

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<main.cpp>

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

; Reference hardware: ESP32-S3 kit's B2B radio, NOT header-connected Wio.
[env:xiao_s3_wio_epaper]
board = seeed_xiao_esp32s3
build_flags =
  ${env.build_flags}
  -DOTD_REFERENCE_XIAO_WIO_EPAPER=1

; Panel-only bring-up. The radio remains deselected and is never initialised.
[env:xiao_s3_panel_test]
board = seeed_xiao_esp32s3
build_src_filter = +<panel_bringup.cpp>
lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59
build_flags =
  ${env.build_flags}
  -DBOARD_SCREEN_COMBO=502
  -DENABLE_EPAPER_BOARD_PIN_SETUPS
  -DUSE_XIAO_EPAPER_DRIVER_BOARD

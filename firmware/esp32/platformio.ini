; Development scaffold only. No radio, panel driver or trusted keys enabled.
[platformio]
default_envs = xiao_s3_wio_epaper

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

; Reference hardware: ESP32-S3 kit's B2B radio, NOT header-connected Wio.
[env:xiao_s3_wio_epaper]
board = seeed_xiao_esp32s3
build_flags =
  ${env.build_flags}
  -DOTD_REFERENCE_XIAO_WIO_EPAPER=1
